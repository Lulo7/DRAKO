<div class="contenedor">
    <app-menulateral></app-menulateral>
    <div class="areatrabajo pagina-admin">
        <header class="encabezado-pagina">
            <p class="eyebrow">ADMINISTRACIÓN</p>
            <h1>Asignación</h1>
            <p class="descripcion">Relación entre roles, rutas y permisos de cada endpoint.</p>
        </header>

        <div class="tabla-envoltura">
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th scope="col">Rol</th>
                        <th scope="col">Path</th>
                        <th scope="col">Permiso</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of datos" (click)="Editar(item._id)">
                        <td class="celda-nombre">{{item.nombrerol}}</td>
                        <td class="celda-codigo">{{item.path}}</td>
                        <td>
                            <span class="etiqueta-estado"
                                [ngClass]="item.permiso == 'Si' ? 'estado-activo' : 'estado-inactivo'">{{item.permiso}}</span>
                        </td>
                    </tr>
                    <tr class="vacio" *ngIf="datos.length === 0">
                        <td colspan="3">No hay asignaciones registradas todavía.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="btnNuevo" (click)="Nuevo()" role="button" title="Nueva asignación">+</div>
    </div>
</div>

<div class="modal fade admin-modal" id="nuevoregistro" tabindex="-1" aria-labelledby="tituloModalAsignacion"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <p class="eyebrow">REGISTRO</p>
                    <h5 class="modal-title" id="tituloModalAsignacion">Asignación</h5>
                </div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="rol">Rol</label>
                    <select class="form-control" id="rol" [(ngModel)]="nombrerol" [disabled]="idseleccionado != ''">
                        <ng-container *ngFor="let item of datosRoles">
                            <option value="{{item.nombre}}">{{item.nombre}}</option>
                        </ng-container>
                    </select>
                </div>
                <div class="form-group">
                    <label for="path">Path</label>
                    <select class="form-control" id="path" [(ngModel)]="path" [disabled]="idseleccionado != ''">
                        <ng-container *ngFor="let item of datosApis">
                            <option value="{{item.path}}">{{item.path}}</option>
                        </ng-container>
                    </select>
                </div>
                <div class="form-group">
                    <label for="permiso">Permiso</label>
                    <select class="form-control" id="permiso" [(ngModel)]="permiso">
                        <option value="Si">Si</option>
                        <option value="No">No</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" (click)="Guardar()"
                    *ngIf="idseleccionado == ''">Guardar</button>
                <button type="button" class="btn btn-primary" (click)="Actualizar()"
                    *ngIf="idseleccionado != ''">Actualizar</button>
                <button type="button" class="btn btn-danger" (click)="Eliminar()"
                    *ngIf="idseleccionado != ''">Eliminar</button>
            </div>
        </div>
    </div>
</div>
