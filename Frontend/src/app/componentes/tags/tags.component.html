<div class="contenedor">
    <app-menulateral></app-menulateral>
    <div class="areatrabajo pagina-admin">
        <header class="encabezado-pagina">
            <p class="eyebrow">ADMINISTRACIÓN</p>
            <h1>Tags</h1>
            <p class="descripcion">Etiquetas utilizadas para clasificar y filtrar los productos.</p>
        </header>

        <div class="tabla-envoltura">
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th scope="col">Código</th>
                        <th scope="col">Nombre</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of datos" (click)="Editar(item._id)">
                        <td class="celda-codigo">{{item.code}}</td>
                        <td class="celda-nombre">{{item.nombre}}</td>
                    </tr>
                    <tr class="vacio" *ngIf="datos.length === 0">
                        <td colspan="2">No hay tags registrados todavía.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="btnNuevo" (click)="Nuevo()" role="button" title="Nuevo tag">+</div>
    </div>
</div>

<div class="modal fade admin-modal" id="nuevoregistro" tabindex="-1" aria-labelledby="tituloModalTags"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <p class="eyebrow">REGISTRO</p>
                    <h5 class="modal-title" id="tituloModalTags">Tags</h5>
                </div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="code">Código</label>
                    <input type="text" class="form-control" id="code" [(ngModel)]="code"
                        [disabled]="idseleccionado != ''">
                </div>
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="form-control" id="nombre" [(ngModel)]="nombre">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" (click)="Guardar()"
                    *ngIf="idseleccionado == ''">Guardar</button>
                <button type="button" class="btn btn-primary" (click)="Actualizar()"
                    *ngIf="idseleccionado != ''">Actualizar</button>
                <button type="button" class="btn btn-danger" (click)="Eliminar()"
                    *ngIf="idseleccionado != ''">Eliminar</button>
            </div>
        </div>
    </div>
</div>
