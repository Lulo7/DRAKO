<div class="contenedor">
    <app-menulateral></app-menulateral>
    <div class="areatrabajo pagina-admin">
        <header class="encabezado-pagina">
            <p class="eyebrow">ADMINISTRACIÓN</p>
            <h1>Usuarios</h1>
            <p class="descripcion">Cuentas registradas en la tienda, su rol y su estado de acceso.</p>
        </header>

        <div class="tabla-envoltura">
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th scope="col">Foto</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Gmail</th>
                        <th scope="col">Rol</th>
                        <th scope="col">Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let item of datos" (click)="Editar(item._id)">
                        <td>
                            <img class="foto-fila" src="{{peticion.dominioavatar}}/Avatares/{{item._id}}.png"
                                onerror="this.onerror=null; this.src='assets/avatar.png';" alt="Avatar">
                        </td>
                        <td class="celda-nombre">{{item.nombre}}</td>
                        <td>{{item.email}}</td>
                        <td class="celda-codigo">{{item.nombrerol}}</td>
                        <td>
                            <span class="etiqueta-estado"
                                [ngClass]="item.activa == 'Si' ? 'estado-activo' : 'estado-inactivo'">{{item.activa}}</span>
                        </td>
                    </tr>
                    <tr class="vacio" *ngIf="datos.length === 0">
                        <td colspan="5">No hay usuarios registrados todavía.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="btnNuevo" (click)="Nuevo()" role="button" title="Nuevo usuario">+</div>
    </div>
</div>

<div class="modal fade admin-modal" id="nuevoregistro" tabindex="-1" aria-labelledby="tituloModalUsuarios"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <p class="eyebrow">REGISTRO</p>
                    <h5 class="modal-title" id="tituloModalUsuarios">Usuarios</h5>
                </div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" class="form-control" id="nombre" [(ngModel)]="nombre">
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" [(ngModel)]="email"
                        [disabled]="idseleccionado != ''">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" class="form-control" id="password" [(ngModel)]="password"
                        [disabled]="idseleccionado != ''">
                </div>
                <div class="form-group">
                    <label for="rol">Rol</label>
                    <select class="form-control" id="rol" [(ngModel)]="nombrerol">
                        <ng-container *ngFor="let item of datosRoles">
                            <option value="{{item.nombre}}">{{item.nombre}}</option>
                        </ng-container>
                    </select>
                </div>
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select class="form-control" id="estado" [(ngModel)]="activa"
                        [disabled]="idseleccionado == ''">
                        <option value="Si">Si</option>
                        <option value="No">No</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" (click)="Guardar()"
                    *ngIf="idseleccionado == ''">Guardar</button>
                <button type="button" class="btn btn-primary" (click)="Actualizar()"
                    *ngIf="idseleccionado != ''">Actualizar</button>
                <button type="button" class="btn btn-danger" (click)="Eliminar()"
                    *ngIf="idseleccionado != ''">Eliminar</button>
            </div>
        </div>
    </div>
</div>
